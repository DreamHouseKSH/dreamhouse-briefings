<figure class="day-visual" aria-labelledby="visual-caption-{{ include.number }}"><svg viewBox="0 0 600 400" role="img" aria-labelledby="visual-title-{{ include.number }}"><title id="visual-title-{{ include.number }}">{{ include.visual.alt | escape }}</title>
{% case include.visual.type %}
{% when 'cover' %}
<text x="30" y="63" class="v-eyebrow">THE DAY IN CONTEXT</text><g data-step="1"><text x="28" y="213" class="v-hero">{{ include.visual.news_count }}</text><text x="38" y="254">뉴스 · 자본과 기술</text></g><g data-step="2"><text x="280" y="213" class="v-hero">{{ include.visual.github_count }}</text><text x="290" y="254">도구 · 실제 작동</text></g><path d="M28 281H560"/><text data-step="3" x="30" y="325" class="v-small">발표 → 적용 조건 → 직접 검증</text>
{% when 'ownership' %}
<text x="30" y="48" class="v-eyebrow">HUMAIN · OWNERSHIP</text><g data-step="1">{% assign share_x = 30 %}{% for segment in include.visual.segments %}{% assign share_w = segment.value | times: 5.4 %}<rect class="{% if forloop.first %}v-accent{% else %}v-secondary{% endif %}" x="{{ share_x }}" y="86" width="{{ share_w }}" height="78"/><text x="{{ share_x | plus: 18 }}" y="135" class="v-inverse">{{ segment.label | escape }} {{ segment.value }}{{ include.visual.unit | escape }}</text>{% assign share_x = share_x | plus: share_w %}{% endfor %}</g><g data-step="2"><text x="30" y="218" class="v-number">현금 99억 리얄</text><text x="31" y="251" class="v-small">약 26억 달러 · 자산 출연 별도</text></g><g data-step="3"><rect x="30" y="280" width="540" height="52" class="v-dashed"/><text x="48" y="313" class="v-small">2030년 3GW 목표 ≠ 현재 가동 용량</text></g>
{% when 'package' %}
<text x="30" y="45" class="v-eyebrow">ADVANCED PACKAGING LAB</text><g data-step="1"><path class="v-secondary" d="M80 205L350 155 530 215 260 280Z"/><text x="65" y="308" class="v-small">기판 연구</text></g><g data-step="2"><path class="v-accent" d="M120 110L240 87 315 113 195 138Z M320 75L435 53 510 78 395 102Z"/><path class="v-dashed" d="M120 111V193M195 138V235M315 113V191M320 76V171M395 102V215M510 79V207"/><text x="32" y="80" class="v-small">칩</text><text x="370" y="149" class="v-small">접합</text></g><g data-step="3"><path d="M40 342H560"/><text x="40" y="369" class="v-small">연구 계획 → 고객 검증 → 양산 검증</text></g>
{% when 'exports' %}
<text x="30" y="42" class="v-eyebrow">OCTOBER EXPORTS · {{ include.visual.unit | escape }}</text>{% assign sorted_bars = include.visual.bars | sort: "value" | reverse %}{% assign bar_max = sorted_bars.first.value | times: 1.0 %}{% for bar in include.visual.bars %}{% assign y = forloop.index0 | times: 92 | plus: 82 %}{% assign w = bar.value | divided_by: bar_max | times: 380 %}<g data-step="{% if forloop.index == 3 %}2{% else %}1{% endif %}"><text x="30" y="{{ y }}" class="v-small">{{ bar.label | escape }} <tspan class="v-value">{{ bar.value }}</tspan></text><rect class="v-accent" x="30" y="{{ y | plus: 12 }}" width="{{ w }}" height="27"/><text x="425" y="{{ y | plus: 33 }}" class="v-small">+{{ bar.growth }}%</text></g>{% endfor %}<text data-step="3" x="30" y="370" class="v-small">증감률: 전년 동월 대비 · 금액, 물량 아님</text>
{% when 'engine' %}
<text x="30" y="42" class="v-eyebrow">LLAMA.CPP · TWO CHANGE PATHS</text><g data-step="1"><rect x="30" y="73" width="540" height="100"/><text x="50" y="108">OpenCL · {{ include.visual.opencl_release | escape }}</text><text x="50" y="148" class="v-small">IQ3_S / IQ3_XXS → Adreno 지원 경로</text></g><g data-step="2"><rect x="30" y="194" width="540" height="100"/><text x="50" y="229">Hexagon · {{ include.visual.hexagon_release | escape }}</text><text x="50" y="269" class="v-small">v75+ 전송 주소 계산 → 오류 수정</text></g><text data-step="3" x="30" y="351" class="v-small">지원 추가 ≠ 속도 향상 입증</text>
{% when 'devices' %}
<text x="30" y="42" class="v-eyebrow">T3 CODE · ACCESS TO YOUR AGENT</text><g data-step="1"><rect x="38" y="80" width="148" height="95" rx="8"/><path d="M25 185H200"/><rect x="245" y="70" width="120" height="115" rx="8"/><rect x="430" y="85" width="65" height="100" rx="12"/><path d="M110 195V230H463V195M305 195V255"/></g><g data-step="2"><rect class="v-accent" x="180" y="257" width="250" height="55" rx="9"/><text x="305" y="293" text-anchor="middle" class="v-inverse">T3 Code</text></g><text data-step="3" x="305" y="359" text-anchor="middle" class="v-small">Claude Code / Codex · 권한은 별도</text>
{% when 'studio' %}
<text x="30" y="42" class="v-eyebrow">GAME STUDIOS · ROLE LIBRARY</text><g data-step="1"><text x="28" y="155" class="v-hero">{{ include.visual.role_count }}</text><text x="35" y="194">에이전트 역할</text></g><g data-step="2"><text x="295" y="155" class="v-hero">{{ include.visual.skill_count }}</text><text x="300" y="194">스킬</text></g><path d="M35 230H565"/><g data-step="3"><rect x="35" y="260" width="530" height="71"/><text x="58" y="305" class="v-small">기획 · 제작 · 검토를 위한 역할 구성</text><text x="35" y="371" class="v-small">정의된 구성 수 ≠ 실제 인원·완성 품질</text></g>
{% when 'memory' %}
<text x="30" y="42" class="v-eyebrow">CLAUDE-MEM · ACROSS SESSIONS</text><g data-step="1"><rect x="30" y="80" width="220" height="122" rx="8"/><text x="50" y="115">이번 세션</text><path d="M50 140H220M50 160H195M50 180H210"/></g><path d="M250 145H310V255H360"/><g data-step="2"><path class="v-accent" d="M360 207Q450 180 540 207V290Q450 320 360 290Z"/><ellipse cx="450" cy="207" rx="90" ry="20"/><text x="450" y="264" text-anchor="middle" class="v-inverse">요약 · 저장</text></g><g data-step="3"><path class="v-dashed" d="M360 290H280V330H40"/><text x="40" y="368" class="v-small">다음 세션에서 필요한 맥락 조회</text></g>
{% when 'dictation' %}
<text x="30" y="42" class="v-eyebrow">HEX · SPEECH TO INPUT</text><g data-step="1"><path class="v-wave" d="M30 125H65L75 110 85 145 95 80 105 170 115 105 125 145 135 100 145 125H185"/><text x="35" y="200" class="v-small">음성 입력</text></g><g data-step="2"><rect class="v-accent" x="225" y="85" width="145" height="90" rx="14"/><text x="298" y="138" text-anchor="middle" class="v-inverse">로컬 전사</text></g><path d="M185 125H225M370 125H420"/><g data-step="3"><rect x="420" y="80" width="150" height="165" rx="8"/><text x="438" y="118" class="v-small">입력창</text><path d="M438 145H550M438 168H530M538 155V180"/><text x="30" y="320" class="v-small">선택한 모델·설정에 따라 처리 경로 확인</text></g>
{% when 'sandbox' %}
<text x="30" y="42" class="v-eyebrow">{{ include.visual.labels.eyebrow | default: "OPENMAUSBOT · PERMISSION BOUNDARY" | escape }}</text><g data-step="1"><path d="M30 80H210V175H110L80 205V175H30Z"/><text x="120" y="132" text-anchor="middle">{{ include.visual.labels.request | default: "대화 요청" | escape }}</text></g><path d="M210 130H280"/><g data-step="2"><rect class="v-dashed" x="280" y="65" width="290" height="250" rx="10"/><rect class="v-accent" x="315" y="100" width="220" height="65" rx="8"/><text x="425" y="140" text-anchor="middle" class="v-inverse">{{ include.visual.labels.agent | default: "에이전트" | escape }}</text><path d="M425 165V205"/><rect x="315" y="205" width="220" height="65"/><text x="425" y="245" text-anchor="middle">{{ include.visual.labels.target | default: "컴퓨터 · 앱" | escape }}</text></g><text data-step="3" x="30" y="365" class="v-small">{{ include.visual.labels.condition | default: "실행 전 파일·앱·호스트 권한을 제한" | escape }}</text>
{% when 'voice-filter' %}
<text x="30" y="42" class="v-eyebrow">HANDY · VOICE ACTIVITY DETECTION</text><g data-step="1"><path class="v-wave" d="M30 100H140L150 80 160 125 170 60 180 145 190 75 200 120 210 100H330L340 70 350 140 360 50 370 150 380 95H560"/><text x="40" y="167" class="v-small">무음</text><text x="145" y="167" class="v-small">말소리</text><text x="270" y="167" class="v-small">무음</text><text x="350" y="167" class="v-small">말소리</text></g><g data-step="2"><rect class="v-accent" x="140" y="185" width="80" height="25"/><rect class="v-accent" x="330" y="185" width="70" height="25"/><path d="M180 220V252H365V220"/><text x="270" y="283" text-anchor="middle">VAD · 음성 구간 선택</text></g><text data-step="3" x="270" y="350" text-anchor="middle" class="v-small">Whisper / Parakeet → 전사</text>
{% when 'headless' %}
<text x="30" y="42" class="v-eyebrow">LIGHTPANDA · WITHOUT A WINDOW</text><g data-step="1"><rect x="30" y="80" width="200" height="210" rx="8"/><text x="50" y="118">자동화 코드</text><path d="M50 150H200M50 180H175M50 210H190M50 240H155"/></g><path d="M230 180H290"/><g data-step="2"><rect class="v-accent" x="290" y="85" width="270" height="85" rx="8"/><text x="425" y="137" text-anchor="middle" class="v-inverse">Headless 엔진</text><path d="M425 170V210"/></g><g data-step="3"><path d="M340 250V220H510V250M425 220V275"/><rect x="310" y="250" width="60" height="45"/><rect x="395" y="275" width="60" height="45"/><rect x="480" y="250" width="60" height="45"/><text x="30" y="365" class="v-small">DOM · 문서 구조 처리 / Chromium 아님</text></g>
{% when 'vision' %}
<defs><pattern id="vision-grid-{{ include.number }}" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="currentColor" stroke-opacity=".3"/></pattern></defs><text x="30" y="42" class="v-eyebrow">KORNIA · IMAGE GEOMETRY</text><g data-step="1"><rect x="35" y="90" width="200" height="200" style="fill:url(#vision-grid-{{ include.number }})"/><path class="v-accent" d="M60 245L120 160 155 200 215 130V270H60Z"/><circle cx="90" cy="125" r="15" class="v-secondary"/></g><path d="M255 190H310"/><g data-step="2"><path d="M335 110L550 70 535 300 355 265Z" style="fill:url(#vision-grid-{{ include.number }})"/><path class="v-accent" d="M365 240L412 165 448 190 528 120 520 280Z"/><circle cx="390" cy="133" r="13" class="v-secondary"/></g><text data-step="3" x="30" y="360" class="v-small">텐서 → 기하 변환 · 합성 이미지 예시</text>
{% when 'metric-bars' %}
<text x="30" y="38" class="v-eyebrow">{{ include.visual.eyebrow | escape }}</text><text x="570" y="65" text-anchor="end" class="v-small">공통 눈금 0–{{ include.visual.scale_max }}{{ include.visual.unit | escape }}</text>
{% for metric in include.visual.metrics %}{% assign y = forloop.index0 | times: 88 | plus: 105 %}{% assign scale = include.visual.scale_max | times: 1.0 %}{% assign w = metric.value | divided_by: scale | times: 400 %}<g data-step="{{ forloop.index }}"><text x="30" y="{{ y }}" class="v-small">{{ metric.label | escape }}</text><rect class="v-track" x="30" y="{{ y | plus: 15 }}" width="400" height="25"/><rect class="v-accent" x="30" y="{{ y | plus: 15 }}" width="{{ w }}" height="25"/><text x="450" y="{{ y | plus: 35 }}" class="v-metric">{{ metric.value }}{{ include.visual.unit | escape }}</text><text x="450" y="{{ y | plus: 57 }}" class="v-micro">{{ metric.qualifier | escape }}</text></g>{% endfor %}<text data-step="3" x="30" y="377" class="v-condition">{{ include.visual.condition | escape }}</text>
{% when 'process-flow' %}
<text x="30" y="35" class="v-eyebrow">{{ include.visual.eyebrow | escape }}</text>{% for node in include.visual.nodes %}{% assign y = forloop.index0 | times: 74 | plus: 55 %}<g data-step="{% if forloop.index > 3 %}3{% else %}{{ forloop.index }}{% endif %}"><text x="30" y="{{ y | plus: 30 }}" class="v-number">0{{ forloop.index }}</text><rect x="95" y="{{ y }}" width="470" height="60" rx="6" class="{% if node.state == 'planned' %}v-dashed{% endif %}"/><text x="115" y="{{ y | plus: 25 }}" class="v-flow-label">{{ node.label | escape }}</text><text x="115" y="{{ y | plus: 48 }}" class="v-micro">{{ node.detail | escape }}</text>{% unless forloop.last %}<path class="v-flow-arrow" d="M330 {{ y | plus: 60 }}v14m-5-5 5 5 5-5"/>{% endunless %}</g>{% endfor %}<text data-step="3" x="30" y="377" class="v-condition">{{ include.visual.condition | escape }}</text>
{% when 'architecture' %}
<text x="30" y="35" class="v-eyebrow">{{ include.visual.eyebrow | escape }}</text><rect class="v-dashed" x="25" y="54" width="550" height="288" rx="12"/><text x="45" y="79" class="v-micro">{{ include.visual.boundary | escape }}</text>{% for layer in include.visual.layers %}{% assign y = forloop.index0 | times: 58 | plus: 93 %}{% assign inset = forloop.index0 | times: 10 %}<g data-step="{% if forloop.index > 3 %}3{% else %}{{ forloop.index }}{% endif %}"><rect class="{% if layer.state == 'planned' %}v-dashed{% else %}v-layer{% endif %}" x="{{ inset | plus: 45 }}" y="{{ y }}" width="{{ 510 | minus: inset | minus: inset }}" height="50" rx="5"/><text x="{{ inset | plus: 60 }}" y="{{ y | plus: 22 }}" class="v-flow-label">{{ layer.label | escape }}</text><text x="{{ inset | plus: 60 }}" y="{{ y | plus: 43 }}" class="v-micro">{{ layer.detail | escape }}</text></g>{% endfor %}<text data-step="3" x="30" y="377" class="v-condition">{{ include.visual.condition | escape }}</text>
{% when 'compatibility' %}
<text x="30" y="35" class="v-eyebrow">{{ include.visual.eyebrow | escape }}</text><text x="30" y="76" class="v-micro">{{ include.visual.headings[0] | default: "구성 요소" | escape }}</text><text x="220" y="76" class="v-micro">{{ include.visual.headings[1] | default: "기존 조건" | escape }}</text><text x="410" y="76" class="v-micro">{{ include.visual.headings[2] | default: "새 조건" | escape }}</text><path d="M30 87H570"/>{% for row in include.visual.rows %}{% assign y = forloop.index0 | times: 62 | plus: 123 %}<g data-step="{% if forloop.index > 3 %}3{% else %}{{ forloop.index }}{% endif %}"><text x="30" y="{{ y }}" class="v-table-label">{{ row.component | escape }}</text><text x="220" y="{{ y }}" class="v-table-label">{{ row.before | escape }}</text><text x="410" y="{{ y }}" class="v-table-label {% if row.status == 'preview' %}v-preview{% endif %}">{{ row.after | escape }}</text><path class="{% if row.status == 'preview' %}v-dashed{% endif %}" d="M30 {{ y | plus: 22 }}H570"/></g>{% endfor %}<text data-step="3" x="30" y="377" class="v-condition">{{ include.visual.condition | escape }}</text>
{% when 'worktree-tree' %}
<text x="30" y="35" class="v-eyebrow">{{ include.visual.eyebrow | escape }}</text><g data-step="1"><rect class="v-accent" x="105" y="65" width="390" height="58" rx="8"/><text x="300" y="101" text-anchor="middle" class="v-inverse">{{ include.visual.root_label | escape }}</text></g><g data-step="2">{% assign last_branch_x = include.visual.branches.size | minus: 1 | times: 190 | plus: 110 %}<path d="M300 123V165H110M300 165H{{ last_branch_x }}"/>{% for branch in include.visual.branches %}{% assign x = forloop.index0 | times: 190 | plus: 30 %}{% assign cx = x | plus: 80 %}<path d="M{{ cx }} 165V198"/><path class="v-tree-folder" d="M{{ x }} 218V198H{{ x | plus: 58 }}L{{ x | plus: 72 }} 212H{{ x | plus: 160 }}V302H{{ x }}Z"/><text x="{{ cx }}" y="249" text-anchor="middle" class="v-tree-label">{{ branch.label | escape }}</text><text x="{{ cx }}" y="278" text-anchor="middle" class="v-micro">{{ branch.directory | escape }}</text>{% endfor %}</g><text data-step="3" x="30" y="377" class="v-condition">{{ include.visual.condition | escape }}</text>
{% when 'timeline' %}
<text x="30" y="35" class="v-eyebrow">{{ include.visual.eyebrow | escape }}</text><g data-step="1"><path class="v-timeline-axis" d="M180 68H560m-8-5 8 5-8 5"/><text x="30" y="74" class="v-micro">장면 구성</text></g><g data-step="2">{% for track in include.visual.tracks %}{% assign y = forloop.index0 | times: 65 | plus: 95 %}<text x="30" y="{{ y | plus: 30 }}" class="v-tree-label">{{ track.label | escape }}</text><path class="v-track" d="M180 {{ y | plus: 47 }}H560"/><rect class="v-layer" x="180" y="{{ y }}" width="380" height="47" rx="5"/><text x="197" y="{{ y | plus: 30 }}" class="v-flow-label">{{ track.content | escape }}</text>{% endfor %}</g><g data-step="3"><path d="M370 280V297m-5-5 5 5 5-5"/><rect class="v-accent" x="115" y="302" width="445" height="42" rx="5"/><text x="337" y="329" text-anchor="middle" class="v-inverse">{{ include.visual.output | escape }}</text><text x="30" y="377" class="v-condition">{{ include.visual.condition | escape }}</text></g>
{% when 'closing' %}
<text x="30" y="42" class="v-eyebrow">THREE QUESTIONS TO TAKE AWAY</text><g data-step="1"><text x="30" y="113" class="v-number">01</text><text x="130" y="108">무엇이 확인됐나?</text><path d="M130 130H560"/></g><g data-step="2"><text x="30" y="213" class="v-number">02</text><text x="130" y="208">어떤 조건이 남았나?</text><path d="M130 230H560"/></g><g data-step="3"><text x="30" y="313" class="v-number">03</text><text x="130" y="308">원문에서 무엇을 볼까?</text><path d="M130 330H560"/></g>
{% endcase %}</svg><ol class="visual-steps">{% for label in include.visual.steps %}<li data-step="{{ forloop.index }}"><span>0{{ forloop.index }}</span>{{ label | escape }}</li>{% endfor %}</ol><figcaption id="visual-caption-{{ include.number }}">{{ include.visual.caption | escape }}</figcaption></figure>
