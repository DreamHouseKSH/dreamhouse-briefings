# 용어집 — 본문 줄임말 자동 풀이(assets/js/glossary.js)와 /glossary/ 페이지의 원본.
# 규칙(docs/WORKFLOW.md 3장 2번): 본문에서 새 줄임말·전문용어를 처음 풀어 쓸 때 여기에도 반드시 추가.
#   term : 본문에 나오는 그대로(대소문자 구분, 단어 단위로 맞춤). 예: API, MoE, KV 캐시
#   full : 원어 전체 이름. 공식 원어가 없거나(브랜드·약어 아님) 확실하지 않으면 "" 로 두고 ko 만.
#   ko   : 쉬운 뜻(한 줄).
#   inline: false → 너무 흔해서 본문 자동 풀이는 안 하고 용어집 페이지에만 표시.
#   prefix: true  → 뒤에 숫자로 시작하는 세대 표기가 붙어도 맞춤(예: HBM4, HBM3E).
# 뒤에 -숫자 꼬리가 붙은 식별자(CVE-2026-1234, CWE-770)는 자동으로 꼬리까지 한 단어로 봄.
# 뜻이 확실하지 않으면 넣지 말 것.

- { term: "AI", full: "Artificial Intelligence", ko: "인공지능", inline: false }
- { term: "API", full: "Application Programming Interface", ko: "프로그램끼리 기능을 주고받는 약속된 창구" }
- { term: "ARR", full: "Annual Recurring Revenue", ko: "연간 반복 매출 — 지금 매출 속도를 1년으로 환산한 값" }
- { term: "B2B", full: "Business to Business", ko: "기업을 상대로 하는 거래·사업" }
- { term: "BF16", full: "bfloat16 (Brain Floating Point 16)", ko: "AI 학습·추론에 많이 쓰는 16비트 부동소수점 형식" }
- { term: "BLAS", full: "Basic Linear Algebra Subprograms", ko: "행렬·벡터 계산 같은 기본 선형대수 연산 라이브러리 규격" }
- { term: "CI", full: "Continuous Integration", ko: "코드를 올릴 때마다 자동으로 빌드·테스트하는 방식" }
- { term: "CISA", full: "Cybersecurity and Infrastructure Security Agency", ko: "미국 사이버보안·기반시설보안청" }
- { term: "CLI", full: "Command-Line Interface", ko: "글자 명령을 입력해 조작하는 터미널 방식" }
- { term: "CPU", full: "Central Processing Unit", ko: "컴퓨터의 범용 중앙 처리 장치" }
- { term: "CTO", full: "Chief Technology Officer", ko: "최고기술책임자" }
- { term: "CUDA", full: "Compute Unified Device Architecture", ko: "엔비디아 GPU로 범용 연산을 하게 해 주는 플랫폼·개발 도구" }
- { term: "CVD", full: "Coordinated Vulnerability Disclosure", ko: "제조사와 일정을 맞춰 취약점을 공개하는 절차" }
- { term: "CVE", full: "Common Vulnerabilities and Exposures", ko: "공개된 보안 취약점마다 붙는 고유 번호" }
- { term: "CVSS", full: "Common Vulnerability Scoring System", ko: "취약점 심각도를 0~10점으로 매기는 기준" }
- { term: "CWE", full: "Common Weakness Enumeration", ko: "취약점의 원인이 되는 약점 유형 분류 번호" }
- { term: "CoWoS", full: "Chip-on-Wafer-on-Substrate", ko: "TSMC의 고급 패키징 — AI GPU와 HBM을 한 패키지로 묶음" }
- { term: "DCGM", full: "Data Center GPU Manager", ko: "엔비디아의 데이터센터 GPU 관리·모니터링 도구" }
- { term: "DNS", full: "Domain Name System", ko: "도메인 이름을 IP 주소로 바꿔 주는 인터넷 주소 체계" }
- { term: "DOE", full: "Department of Energy", ko: "미국 에너지부" }
- { term: "DRAM", full: "Dynamic Random Access Memory", ko: "컴퓨터 주기억장치로 쓰는 메모리 반도체(D램)" }
- { term: "DSL", full: "Domain-Specific Language", ko: "특정 용도 전용으로 만든 프로그래밍 언어" }
- { term: "DoS", full: "Denial of Service", ko: "서비스 거부 — 시스템을 마비시켜 못 쓰게 만드는 공격" }
- { term: "E2E", full: "End-to-End", ko: "처음부터 끝까지 — 테스트에선 사용자 시나리오 전체를 자동으로 검증" }
- { term: "EU", full: "European Union", ko: "유럽연합", inline: false }
- { term: "FP4", full: "4-bit Floating Point", ko: "4비트 부동소수점 — AI 추론용 저정밀 숫자 형식" }
- { term: "FP8", full: "8-bit Floating Point", ko: "8비트 부동소수점 — AI 학습·추론용 저정밀 숫자 형식" }
- { term: "FWHT", full: "Fast Walsh–Hadamard Transform", ko: "빠른 월시-아다마르 변환(신호·벡터를 섞어 주는 수학 변환)" }
- { term: "GA", full: "General Availability", ko: "누구나 쓸 수 있는 정식 출시" }
- { term: "GEMM", full: "General Matrix Multiply", ko: "행렬 곱셈 연산 — LLM 계산의 대부분" }
- { term: "GEO", full: "Generative Engine Optimization", ko: "AI 답변에 내 정보가 잘 나오게 하는 최적화" }
- { term: "GGUF", full: "", ko: "llama.cpp 등에서 쓰는 (주로 양자화된) 모델 파일 형식" }
- { term: "GKE", full: "Google Kubernetes Engine", ko: "구글 클라우드의 관리형 쿠버네티스(컨테이너 운영) 서비스" }
- { term: "GPU", full: "Graphics Processing Unit", ko: "그래픽 처리 장치 — AI 연산에 주로 쓰는 병렬 연산 칩" }
- { term: "GRPO", full: "Group Relative Policy Optimization", ko: "여러 답안을 묶어 서로 비교해 보상을 주는 강화학습 기법" }
- { term: "GUI", full: "Graphical User Interface", ko: "창·버튼으로 조작하는 그래픽 화면" }
- { term: "HBM", full: "High Bandwidth Memory", ko: "D램을 수직으로 쌓아 데이터 통로를 크게 넓힌 AI 가속기용 메모리", prefix: true }
- { term: "HTML", full: "HyperText Markup Language", ko: "웹 페이지를 만드는 표시 언어" }
- { term: "HTTP", full: "HyperText Transfer Protocol", ko: "웹에서 데이터를 주고받는 통신 규약" }
- { term: "HTTPS", full: "HyperText Transfer Protocol Secure", ko: "암호화된 HTTP" }
- { term: "IDE", full: "Integrated Development Environment", ko: "코드 작성·실행·디버깅을 한곳에서 하는 개발 도구" }
- { term: "IFRS", full: "International Financial Reporting Standards", ko: "국제회계기준" }
- { term: "INT4", full: "4-bit Integer", ko: "4비트 정수 — 모델을 작게 줄이는 양자화에 쓰는 형식" }
- { term: "INT8", full: "8-bit Integer", ko: "8비트 정수 — 모델을 작게 줄이는 양자화에 쓰는 형식" }
- { term: "IPO", full: "Initial Public Offering", ko: "기업공개 — 주식시장에 처음 상장" }
- { term: "ISO", full: "International Organization for Standardization", ko: "국제표준화기구" }
- { term: "IT", full: "Information Technology", ko: "정보기술", inline: false }
- { term: "JSON", full: "JavaScript Object Notation", ko: "데이터를 글자로 주고받는 표준 형식" }
- { term: "KEV", full: "Known Exploited Vulnerabilities", ko: "실제 공격에 악용 중인 것으로 확인된 취약점 목록(CISA 운영)" }
- { term: "KST", full: "Korea Standard Time", ko: "한국 표준시(UTC+9)", inline: false }
- { term: "KV 캐시", full: "Key-Value cache", ko: "앞서 계산한 토큰의 키·값을 저장해 다시 계산하지 않게 하는 저장소" }
- { term: "LLM", full: "Large Language Model", ko: "대규모 언어 모델" }
- { term: "LoRA", full: "Low-Rank Adaptation", ko: "일부 가중치만 저비용으로 덧대어 학습하는 미세조정 기법" }
- { term: "MCP", full: "Model Context Protocol", ko: "AI가 외부 도구·데이터에 붙는 표준 규격" }
- { term: "MKL", full: "Math Kernel Library", ko: "인텔의 고성능 수학 연산 라이브러리" }
- { term: "MLA", full: "Multi-head Latent Attention", ko: "키·값을 압축해 메모리를 줄인 어텐션 방식(DeepSeek 고안)" }
- { term: "MLX", full: "", ko: "애플이 만든 머신러닝 프레임워크 — 맥의 통합 메모리에 최적화" }
- { term: "MMA", full: "Matrix Multiply-Accumulate", ko: "행렬을 곱해 결과에 더하는 GPU 행렬 연산" }
- { term: "MRL", full: "Matryoshka Representation Learning", ko: "벡터를 앞부분만 잘라 써도 품질이 유지되게 학습하는 기법" }
- { term: "MS", full: "Microsoft", ko: "마이크로소프트" }
- { term: "MTEB", full: "Massive Text Embedding Benchmark", ko: "텍스트 임베딩 모델 성능을 재는 대규모 벤치마크" }
- { term: "MTP", full: "Multi-Token Prediction", ko: "한 번에 여러 토큰을 예측하는 기법" }
- { term: "MoE", full: "Mixture of Experts", ko: "여러 전문가 하위망 중 일부만 골라 계산해 비용을 줄이는 구조" }
- { term: "NIH", full: "National Institutes of Health", ko: "미국 국립보건원" }
- { term: "NIST", full: "National Institute of Standards and Technology", ko: "미국 국립표준기술연구소" }
- { term: "NPU", full: "Neural Processing Unit", ko: "AI 연산 전용 처리 장치" }
- { term: "NSF", full: "National Science Foundation", ko: "미국 국립과학재단" }
- { term: "OAuth", full: "Open Authorization", ko: "비밀번호 대신 권한 토큰으로 접근을 허락하는 표준" }
- { term: "OCR", full: "Optical Character Recognition", ko: "광학 문자 인식 — 이미지 속 글자를 텍스트로 읽어 냄" }
- { term: "OOB", full: "Out-of-Bounds", ko: "범위 밖 — 허용된 메모리 범위를 벗어난 접근" }
- { term: "OS", full: "Operating System", ko: "운영체제" }
- { term: "OSS", full: "Open Source Software", ko: "오픈소스 소프트웨어" }
- { term: "OSWorld", full: "", ko: "AI 에이전트가 실제 컴퓨터 화면을 조작해 과제를 푸는 능력을 재는 벤치마크" }
- { term: "PER", full: "Price-to-Earnings Ratio", ko: "주가수익비율 — 주가가 주당순이익의 몇 배인지" }
- { term: "PII", full: "Personally Identifiable Information", ko: "개인을 식별할 수 있는 정보" }
- { term: "PR", full: "Pull Request", ko: "코드 변경을 합쳐 달라는 요청" }
- { term: "PSRAM", full: "Pseudo-Static RAM", ko: "마이크로컨트롤러에 덧붙이는 저렴한 외부 메모리" }
- { term: "PoC", full: "Proof of Concept", ko: "개념 증명 — 보안에선 공격이 실제로 되는지 보여 주는 시연 코드" }
- { term: "QAT", full: "Quantization-Aware Training", ko: "양자화 인식 학습 — 저정밀도로 줄일 것을 고려하며 학습" }
- { term: "RAG", full: "Retrieval-Augmented Generation", ko: "검색한 자료를 근거로 붙여 답하게 하는 방식" }
- { term: "RAM", full: "Random Access Memory", ko: "주기억장치(메모리)" }
- { term: "RC", full: "Release Candidate", ko: "정식 출시 전 후보판" }
- { term: "RCE", full: "Remote Code Execution", ko: "원격 코드 실행 — 공격자가 원격으로 코드를 돌릴 수 있는 취약점" }
- { term: "RL", full: "Reinforcement Learning", ko: "강화학습 — 보상 신호로 행동을 개선하는 학습" }
- { term: "ROCm", full: "", ko: "AMD의 GPU 연산 플랫폼 — 엔비디아 CUDA에 대응" }
- { term: "RPC", full: "Remote Procedure Call", ko: "다른 컴퓨터의 기능을 네트워크로 호출하는 방식" }
- { term: "SDK", full: "Software Development Kit", ko: "개발 도구 모음" }
- { term: "SKU", full: "Stock Keeping Unit", ko: "따로 값을 매겨 파는 판매 단위" }
- { term: "SQL", full: "Structured Query Language", ko: "데이터베이스에 질의하는 언어" }
- { term: "SSD", full: "Solid State Drive", ko: "반도체 기반 저장 장치" }
- { term: "SSO", full: "Single Sign-On", ko: "한 번 로그인으로 여러 서비스를 쓰는 통합 로그인" }
- { term: "STT", full: "Speech-to-Text", ko: "음성을 텍스트로 바꾸는 기술" }
- { term: "SYCL", full: "", ko: "C++로 여러 종류의 칩(인텔 GPU 등)에서 병렬 연산을 하게 하는 크로노스 그룹 표준" }
- { term: "SaaS", full: "Software as a Service", ko: "설치 없이 인터넷으로 구독해 쓰는 소프트웨어" }
- { term: "TTFT", full: "Time To First Token", ko: "첫 토큰이 나오기까지 걸리는 시간" }
- { term: "UI", full: "User Interface", ko: "사용자 화면·조작 방식" }
- { term: "VRAM", full: "Video RAM", ko: "GPU에 달린 전용 메모리" }
- { term: "VRP", full: "Vulnerability Reward Program", ko: "취약점 신고 보상 프로그램(버그 바운티)" }
- { term: "YC", full: "Y Combinator", ko: "미국의 대표적 스타트업 액셀러레이터" }
- { term: "npm", full: "", ko: "자바스크립트·Node.js용 패키지 관리 도구이자 공개 패키지 저장소" }
